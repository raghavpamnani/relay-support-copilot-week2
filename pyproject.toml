[project]
name = "relay-support-copilot"
version = "1.0.0"
description = "A local-first, authenticated AI support triage microservice"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "streamlit>=1.42,<2", "requests>=2.32,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5", "types-requests>=2.32"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
